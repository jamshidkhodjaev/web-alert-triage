name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies if present
        run: |
          if [ -f requirements.txt ]; then
            python3 -m pip install -r requirements.txt
          fi

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Verify end-to-end report and proposal generation
        run: |
          python3 src/parser.py --output-dir "$RUNNER_TEMP/out"
          diff examples/report.md "$RUNNER_TEMP/out/report.md"
          diff examples/response_proposal.json "$RUNNER_TEMP/out/response_proposal.json"
          diff examples/completion.json "$RUNNER_TEMP/out/completion.json"
